# Replace certificate paths with valid origin certificates before enabling.
server {
    listen 80;
    server_name messageapi.demohub24.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name messageapi.demohub24.com;
    ssl_certificate /etc/letsencrypt/live/messageapi.demohub24.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/messageapi.demohub24.com/privkey.pem;

    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
